<!DOCTYPE html>
<html lang="es-mx">

<head>
    <meta charset="UTF-8">
    <title>JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/codigo.js"></script>
</head>

<body>
    <section class="contenedor">
        <header>
            <h1>IntroJS</h1>
        </header>
        <main>
            <h1>Bienvenidos a IntroJS</h1>
            <h2>Caso1: llamado a un script dentro de un archivo html</h2>
            <script>
                function sumar() {
                    let op1 = parseFloat(document.getElementById("op1").value);
                    let op2 = parseFloat(document.getElementById("op2").value);
                    if (isNaN(op1) || isNaN(op2)) return alert("NO PUEDES DEJAR LOS CAMPOS VACIOS");
                    let x = document.getElementById("resultado1");
                    x.innerHTML = op1 + op2;
                }
                function restar(){
                    let op1 = parseFloat(document.getElementById("op1").value);
                    let op2 = parseFloat(document.getElementById("op2").value);
                    if (isNaN(op1) || isNaN(op2)) return alert("NO PUEDES DEJAR LOS CAMPOS VACIOS");
                    let x = document.getElementById("resultado1");
                    x.innerHTML=op1-op2;
                }
                function multiplicar(){
                    let op1 = parseFloat(document.getElementById("op1").value);
                    let op2 = parseFloat(document.getElementById("op2").value);
                    if (isNaN(op1) || isNaN(op2)) return alert("NO PUEDES DEJAR LOS CAMPOS VACIOS");
                    let x = document.getElementById("resultado1");
                    x.innerHTML=op1*op2;
                }
                function dividir(){
                    let op1 = parseFloat(document.getElementById("op1").value);
                    let op2 = parseFloat(document.getElementById("op2").value);
                    if (isNaN(op1) || isNaN(op2)) return alert("NO PUEDES DEJAR LOS CAMPOS VACIOS");
                    let x = document.getElementById("resultado1");
                    x.innerHTML=(op1/op2).toFixed(4);
                }
                
            </script>
            <label for="op1">Operando1: </label>
            <input type="text" id="op1" name="op1" />
            <label for="op2">Operando2: </label>
            <input type="text" id="op2" name="op2" />
            <label for="resultado1">Resultado: </label>
            <output id="resultado1">0</output>
            <br>
            <button class="callJS" onclick="sumar()">Sumar</button>
            <button class="callJS" onclick="restar()">Restar</button>
            <button class="callJS" onclick="multiplicar()">Multiplicar</button>
            <button class="callJS" onclick="dividir()">Dividir</button>

            <h2>Caso2: llamado a un script externo (js/archivo.js) por medio de evento</h2>

            <label for="edad">Edad</label>
            <input type="text" id="edad" name="edad"/>
            <label for="peso">Peso</label>
            <input type="text" id="peso" name="peso"/>

            <label for="nivel">Nivel de ejercicio</label>
            <select id="nivel" name="nivel">
                <option value = "1.2">Sedentarismo: Nada de ejercicio</option>
                <option value = "1.375">Actividad ligera: ejercicio ligero o deporte 1-3 días a la semana</option>
                <option value = "1.55">Actividad moderada: ejercicio moderado o deporte 3-5 días a la semana</option>
                <option value = "1.725">Actividad intensa: ejercicio intenso o deporte 6-7 días a la semana</option>
                <option value = "1.9">Actividad muy intensa: ejercicio muy intenso o trabajo físico y ejercicio diario</option>
            </select>

            <br>
            <label for="estatura">Estatura</label>
            <input type="text" id="estatura" name="estatura">
            <label for="sexo">Sexo</label>
            <label><input type="radio" id="sexo" name="opcion" value="hombre" 
                onclick="sexo=this.value"/>hombre</label>
            <label><input type="radio" id="sexo" name="opcion" value="mujer" 
                onclick = "sexo=this.value"/>mujer</label>
                
            <button class="callJS" onclick="codigoJS()">Presiona para ejecutar</button>
            <br>
            <br>
            <label for="resultado2">Metabolismo Basal: </label>
            <output id="resultado2">0</output>
            <br>
            <label for="resultado3">Calorias Diarias Totales: </label>
            <output id="resultado3">0</output>
            
            
        </main>
        <footer>
            <h3>Creative Commons 4.0 2026</h3>
        </footer>
    </section>
</body>

</html>
